[versions]
agp = "8.13.0"
hiltAndroid = "2.48"
kotlin = "1.9.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
kotlinGradlePlugin = "1.6.21"
kotlinxMetadataJvm = "0.5.0"
kotlinxSerializationJson = "1.5.1"
loggingInterceptor = "4.2.2"
lottie = "5.0.2"
material = "1.12.0"
activity = "1.9.0"
constraintlayout = "2.1.4"
multidex = "2.0.1"
okhttp = "4.11.0"
ossLicensesPlugin = "0.10.6"
playServicesOssLicenses = "17.1.0"
