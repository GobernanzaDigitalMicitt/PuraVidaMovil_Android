# stages: 빌드, 테스트, 배포 등의 단계를 정의합니다.
stages:
  - build


# # cache: Gradle 종속성을 캐싱하여 빌드 시간을 단축합니다.
cache:
  paths:
    - .gradle/
    - ~/.gradle/

# before_script: 모든 스크립트 실행 전에 공통적으로 수행되는 작업을 정의합니다.
before_script:
  # Android SDK 경로를 환경 변수로 설정합니다. 
  - export ANDROID_HOME="$ANDROID_SDK_ROOT"
  - export GRADLE_USER_HOME=$(pwd)/.gradle
  - chmod +x ./gradlew

# build_job: 앱을 빌드하고 디버그 APK 파일을 생성하는 단계입니다.
build_job:
  stage: build
  tags:
    - jslim  # "jslim" 태그가 지정된 러너에서만 이 작업이 실행됩니다.
  script:
    - echo "Building on macOS runner..."
    # - TIMESTAMP=$(date +%Y%m%d%H%M%S)
    # - APK_FILE="PuraVidaMovil_Android_1.0.0.9_${TIMESTAMP}.apk"
    - ./gradlew --stop
    - ./gradlew assembleDebug # 디버그용 APK 파일을 빌드합니다.
    # - mv app/build/outputs/apk/debug/PuraVidaMovil_Android_1.0.0.9.apk app/build/outputs/apk/debug/$APK_FILE
    - npm install -g firebase-tools # Firebase CLI를 설치합니다. 
    - firebase --version
    # Firebase CLI를 사용하여 APK를 App Distribution에 업로드합니다.
    # $FIREBASE_APP_ID 변수를 사용하여 앱 ID를 가져옵니다. 
    - firebase appdistribution:distribute app/build/outputs/apk/debug/PuraVidaMovil_Android*.apk --token "$FIREBASE_TOKEN" --app "$FIREBASE_APP_ID" --release-notes "GitLab CI/CD를 통해 자동 배포되었습니다." --groups "tester"
  artifacts:
    paths:
      - app/build/outputs/apk/debug/PuraVidaMovil_Android*.apk # 빌드된 APK 파일을 아티팩트로 저장합니다.
    expire_in: 1 day


